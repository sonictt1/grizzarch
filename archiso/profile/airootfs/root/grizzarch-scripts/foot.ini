# foot terminal configuration for grizzarch
# Translated from termite config — colours match the original Zenburn-inspired palette
# https://codeberg.org/dnkl/foot/wiki

[main]
font=Droid Sans Mono:size=12
scrollback-lines=10000

[colors]
# Background opacity — 0.7 matches termite's rgba(88, 88, 88, 0.7)
alpha=0.7
background=585858
foreground=dcdccc

# Selection colours
selection-background=2f2f2f
selection-foreground=dcdccc

# Normal (regular) colours
regular0=3f3f3f
regular1=705050
regular2=60b48a
regular3=dfaf8f
regular4=506070
regular5=dc8cc3
regular6=8cd0d3
regular7=dcdccc

# Bright colours
bright0=709080
bright1=dca3a3
bright2=c3bf9f
bright3=f0dfaf
bright4=94bff3
bright5=ec93d3
bright6=93e0e3
bright7=ffffff
